<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal Bridge Diagnostic</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    padding-bottom: 60px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .banner {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .banner.ok { background: rgba(63,185,80,0.15); color: var(--ok); border: 1px solid var(--ok); }
  .banner.warn { background: rgba(210,153,34,0.15); color: var(--warn); border: 1px solid var(--warn); }
  .banner.err { background: rgba(248,81,73,0.15); color: var(--err); border: 1px solid var(--err); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    flex: 1 1 auto;
    min-width: 100px;
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  button:active { background: #30363d; }
  .kv { font-size: 12px; color: var(--muted); margin: 3px 0; word-break: break-all; }
  .kv b { color: var(--text); }
  #log {
    background: #010409;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    height: 220px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
  }
  .log-ok { color: var(--ok); }
  .log-err { color: var(--err); }
  .log-info { color: var(--muted); }
</style>
</head>
<body>

<h1>Portal Bridge Diagnostic</h1>
<div class="sub">Self-contained test page — no external files required.</div>

<div id="envBanner" class="banner warn">Checking environment…</div>

<div class="card">
  <h2>Bridge Status</h2>
  <div class="kv">Ready: <b id="stReady">–</b></div>
  <div class="kv">Protocol version (shell): <b id="stProto">–</b></div>
  <div class="kv">App ID (from registry): <b id="stAppId">–</b></div>
  <div class="kv">Capabilities: <b id="stCaps">–</b></div>
  <div class="row" style="margin-top:8px;">
    <button onclick="refreshCapabilities()">Refresh getCapabilities()</button>
  </div>
</div>

<div class="card">
  <h2>Haptics</h2>
  <div class="row">
    <button onclick="run('haptics.light')">Light</button>
    <button onclick="run('haptics.medium')">Medium</button>
    <button onclick="run('haptics.heavy')">Heavy</button>
    <button onclick="run('haptics.success')">Success</button>
    <button onclick="run('haptics.warning')">Warning</button>
    <button onclick="run('haptics.error')">Error</button>
  </div>
</div>

<div class="card">
  <h2>Notifications</h2>
  <div class="row">
    <button onclick="run('notifications.requestPermission')">Request Permission</button>
    <button onclick="scheduleTestNotification()">Schedule (10s)</button>
    <button onclick="run('notifications.cancelAll')">Cancel All</button>
  </div>
</div>

<div class="card">
  <h2>Alarms</h2>
  <div class="row">
    <button onclick="scheduleTestAlarm()">Schedule (30s)</button>
    <button onclick="run('alarms.cancelAll')">Cancel All</button>
  </div>
</div>

<div class="card">
  <h2>Biometrics</h2>
  <div class="row">
    <button onclick="run('biometrics.isAvailable')">Check Available</button>
    <button onclick="run('biometrics.authenticate')">Authenticate</button>
  </div>
</div>

<div class="card">
  <h2>Files</h2>
  <div class="row">
    <button onclick="pickAndReadFile()">Pick + Read File</button>
    <button onclick="saveTestFile()">Save Test File</button>
  </div>
</div>

<div class="card">
  <h2>Log</h2>
  <div id="log"></div>
  <div class="row" style="margin-top:8px;">
    <button onclick="document.getElementById('log').innerHTML=''">Clear Log</button>
  </div>
</div>

<script>
/* ---- Embedded Portal Bridge Client (v1) — inline for this standalone test page only.
   Your real PWAs should load the shared hosted portalBridge.js instead of embedding it. ---- */
(function (window) {
  const CLIENT_PROTOCOL_VERSION = 1;
  const DEFAULT_TIMEOUT_MS = 10000;
  const INTERACTIVE_TIMEOUT_MS = 120000;
  const pendingRequests = new Map();
  let bridgeReady = false;
  let shellProtocolVersion = null;
  let capabilitiesCache = null;

  function isInsideShell() {
    return Boolean(window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function');
  }
  function markReady(detail) {
    bridgeReady = true;
    shellProtocolVersion = detail?.protocolVersion ?? null;
  }
  if (isInsideShell()) {
    if (window.__portalShellBridgeReady) markReady({ protocolVersion: window.__portalShellProtocolVersion });
    window.addEventListener('PortalShellBridgeReady', (e) => markReady(e.detail || {}));
  }
  function waitForReady(timeoutMs = 8000) {
    if (!isInsideShell()) return Promise.reject(Object.assign(new Error('NOT_IN_SHELL'), { code: 'NOT_IN_SHELL' }));
    if (bridgeReady) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        window.removeEventListener('PortalShellBridgeReady', onReady);
        reject(Object.assign(new Error('Bridge not ready in time'), { code: 'BRIDGE_NOT_READY_TIMEOUT' }));
      }, timeoutMs);
      function onReady(e) {
        clearTimeout(timer);
        window.removeEventListener('PortalShellBridgeReady', onReady);
        markReady(e.detail || {});
        resolve();
      }
      window.addEventListener('PortalShellBridgeReady', onReady);
    });
  }
  window.addEventListener('PortalShellBridgeResponse', (event) => {
    const { requestId, success, data, error } = event.detail || {};
    const pending = pendingRequests.get(requestId);
    if (!pending) return;
    pendingRequests.delete(requestId);
    clearTimeout(pending.timer);
    if (success) pending.resolve(data);
    else {
      const err = new Error(error?.message || 'Native bridge error');
      err.code = error?.code || 'NATIVE_ERROR';
      pending.reject(err);
    }
  });
  function defaultTimeoutFor(type) {
    if (capabilitiesCache?.recommendedTimeouts?.[type]) return capabilitiesCache.recommendedTimeouts[type];
    if (type === 'file.pick' || type === 'biometric.authenticate') return INTERACTIVE_TIMEOUT_MS;
    return DEFAULT_TIMEOUT_MS;
  }
  async function send(type, payload = {}, timeoutOverrideMs) {
    if (!isInsideShell()) throw Object.assign(new Error('NOT_IN_SHELL'), { code: 'NOT_IN_SHELL' });
    await waitForReady();
    const timeoutMs = timeoutOverrideMs ?? defaultTimeoutFor(type);
    const requestId = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pendingRequests.delete(requestId);
        reject(Object.assign(new Error(`Timeout: ${type}`), { code: 'TIMEOUT' }));
      }, timeoutMs);
      pendingRequests.set(requestId, { resolve, reject, timer });
      window.ReactNativeWebView.postMessage(JSON.stringify({ type, requestId, protocolVersion: CLIENT_PROTOCOL_VERSION, payload }));
    });
  }
  async function getCapabilities(force = false) {
    if (capabilitiesCache && !force) return capabilitiesCache;
    capabilitiesCache = await send('bridge.getCapabilities', {});
    return capabilitiesCache;
  }
  window.PortalBridge = {
    isInsideShell, waitForReady, getCapabilities,
    hasCapability: (n) => Boolean(capabilitiesCache?.capabilities?.includes(n)),
    send,
    haptics: {
      light: () => send('haptic.light'), medium: () => send('haptic.medium'), heavy: () => send('haptic.heavy'),
      success: () => send('haptic.success'), warning: () => send('haptic.warning'), error: () => send('haptic.error'),
    },
    notifications: {
      requestPermission: () => send('notification.requestPermission'),
      schedule: (o) => send('notification.schedule', o),
      cancel: (id) => send('notification.cancel', { notificationId: id }),
      cancelAll: () => send('notification.cancelAll'),
    },
    alarms: {
      schedule: (o) => send('alarm.schedule', o),
      cancel: (id) => send('alarm.cancel', { alarmId: id }),
      cancelAll: () => send('alarm.cancelAll'),
    },
    biometrics: {
      isAvailable: () => send('biometric.isAvailable'),
      authenticate: (msg = 'Verify your identity') => send('biometric.authenticate', { promptMessage: msg }),
    },
    files: {
      pick: (type = '*/*') => send('file.pick', { type }),
      read: (uri, enc = 'utf8') => send('file.read', { uri, encoding: enc }),
      save: (filename, content, mimeType = 'text/plain') => send('file.save', { filename, content, mimeType }),
      share: (uri, title = 'Share File') => send('file.share', { uri, dialogTitle: title }),
    },
  };
})(window);

/* ---- Diagnostic page logic ---- */
const logEl = document.getElementById('log');
function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = 'log-' + type;
  line.textContent = `[${time}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function getFn(path) {
  return path.split('.').reduce((obj, key) => obj[key], window.PortalBridge);
}

async function run(path, payload) {
  log(`→ calling ${path}...`);
  try {
    const fn = getFn(path);
    const result = payload !== undefined ? await fn(payload) : await fn();
    log(`✓ ${path} succeeded: ${JSON.stringify(result)}`, 'ok');
    return result;
  } catch (err) {
    log(`✗ ${path} failed [${err.code || 'ERROR'}]: ${err.message}`, 'err');
    throw err;
  }
}

async function scheduleTestNotification() {
  await run('notifications.schedule', { title: 'Portal Test', body: 'This fired 10s after tapping the button.', trigger: { seconds: 10 } });
}
async function scheduleTestAlarm() {
  const future = new Date(Date.now() + 30000).toISOString();
  await run('alarms.schedule', { title: 'Portal Test Alarm', body: 'This should ring even in DND.', date: future });
}
async function pickAndReadFile() {
  const picked = await run('files.pick', '*/*');
  if (picked && !picked.cancelled && picked.uri) {
    await run('files.read', { uri: picked.uri, encoding: 'utf8' });
  }
}
async function saveTestFile() {
  await run('files.save', { filename: 'portal-test.txt', content: 'Hello from Portal bridge test.', mimeType: 'text/plain' });
}

async function refreshCapabilities() {
  try {
    const caps = await window.PortalBridge.getCapabilities(true);
    document.getElementById('stAppId').textContent = caps.appId ?? '–';
    document.getElementById('stCaps').textContent = (caps.capabilities || []).join(', ') || '(none)';
    log(`getCapabilities() → ${JSON.stringify(caps)}`, 'ok');
  } catch (err) {
    document.getElementById('stAppId').textContent = 'error';
    document.getElementById('stCaps').textContent = err.code || 'error';
    log(`getCapabilities() failed [${err.code}]: ${err.message}`, 'err');
  }
}

async function boot() {
  const banner = document.getElementById('envBanner');
  if (!window.PortalBridge.isInsideShell()) {
    banner.className = 'banner err';
    banner.textContent = '✗ Not running inside Portal Shell (plain browser detected). Open this page inside the Portal Shell APK to test the bridge.';
    log('Environment check: NOT inside shell.', 'err');
    return;
  }
  banner.className = 'banner warn';
  banner.textContent = 'Inside shell — waiting for ready handshake…';
  log('Environment check: inside shell. Waiting for PortalShellBridgeReady...');

  try {
    await window.PortalBridge.waitForReady();
    document.getElementById('stReady').textContent = 'yes';
    document.getElementById('stProto').textContent = window.PortalBridge.send ? '1 (see log)' : '–';
    banner.className = 'banner ok';
    banner.textContent = '✓ Bridge is ready. Run the tests below.';
    log('Ready handshake received.', 'ok');
    await refreshCapabilities();
  } catch (err) {
    document.getElementById('stReady').textContent = 'timeout';
    banner.className = 'banner err';
    banner.textContent = '✗ Ready handshake never arrived — bridge setup issue in the shell.';
    log(`Ready handshake failed [${err.code}]: ${err.message}`, 'err');
  }
}

boot();
</script>
</body>
</html>
